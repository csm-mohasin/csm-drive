name = "csm-drive-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# ── Allowed Origins (add your GitHub Pages URL) ────────────────
[vars]
ALLOWED_ORIGIN = "https://csm-storage.github.io"

# ──────────────────────────────────────────────────────────────
# SECRET Environment Variables
# Set these via Cloudflare Dashboard OR using:
#   wrangler secret put VARIABLE_NAME
# ──────────────────────────────────────────────────────────────
# Required Secrets (DO NOT put real values here — use Dashboard):
#
#   FIREBASE_PROJECT_ID
#   CLOUDINARY_CLOUD_NAME
#   CLOUDINARY_UPLOAD_PRESET
#   CLOUDINARY_API_KEY
#   CLOUDINARY_API_SECRET
#   GOOGLE_SERVICE_ACCOUNT_EMAIL
#   GOOGLE_PRIVATE_KEY
#   GOOGLE_PHOTOS_CLIENT_ID
#   GOOGLE_PHOTOS_CLIENT_SECRET
#   GOOGLE_PHOTOS_REFRESH_TOKEN
